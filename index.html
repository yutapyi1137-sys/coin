
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コイン計算</title>

  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* 背景 */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url("background.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    body {
      margin: 0;
      padding: 20px 0;
      font-family: "Zen Maru Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #444;
      box-sizing: border-box;
    }

    /* メインカード */
    .container {
      width: 340px;
      max-width: calc(100% - 32px);
      padding: 24px;
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.15);
      text-align: center;
      box-sizing: border-box;
    }

    /* タイトル */
    h1 {
      font-size: 28px;
      color: #ff4f8b;
      padding: 8px 20px;
      margin-bottom: 24px;
      border: 2px solid #ff9ac2;
      border-radius: 18px;
      background: #fff;
      display: inline-block;
    }

    /* 入力行 */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    label {
      font-size: 24px;
    }

    input {
      width: 120px;
      height: 42px;
      font-size: 20px;
      border-radius: 14px;
      border: 2px solid #ffd1e1;
      padding: 0 10px;
      outline: none;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #ff6f9e;
    }

    /* 計算結果 */
    .result {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 22px;
      border: 2px solid #ff9ac2;
      border-radius: 18px;
      background: #fff0f6;
      display: inline-block;
    }

    .coin-number {
      font-size: 36px;
      color: #ff2f7a;
      margin-left: 6px;
      font-weight: bold;
    }

    /* Mirrativ画像リンク */
    .link-image {
      margin-top: 24px;
      cursor: pointer;
      transition: 0.2s;
    }

    .link-image img {
      width: 280px;
      max-width: 100%;
      height: 72px;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    .link-image:hover {
      transform: scale(1.05);
    }

    /* チアリ表リンク */
    .cheer-link {
      margin-top: 24px;
    }

    .cheer-link a {
      display: inline-block;
      color: #e875a5;
      background: #fff;
      border: 2px solid #ff9ac2;
      border-radius: 18px;
      padding: 10px 30px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: 0.2s;
    }

    .cheer-link a:hover {
      transform: scale(1.05);
      background: #fff0f6;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <h1>コイン計算</h1>

  <div class="row">
    <label>無償コイン</label>
    <input type="number" id="freeCoin" inputmode="numeric" oninput="calculate()">
  </div>

  <div class="row">
    <label>有償コイン</label>
    <input type="number" id="paidCoin" inputmode="numeric" oninput="calculate()">
  </div>

  <div class="result">
    還元コイン：
    <span class="coin-number" id="coinValue">0</span>
  </div>

  <!-- Mirrativへ移動 -->
  <div class="link-image" onclick="openMirrativ()">
    <img src="mirrativ-button.png" alt="コイン購入">
  </div>

  <!-- チアリ表を開く -->
  <div class="cheer-link">
    <a href="cheer-table.jpeg" target="_blank" rel="noopener noreferrer">
      チアリ表
    </a>
  </div>

</div>

<script>
function calculate() {
  const free = Number(document.getElementById("freeCoin").value) || 0;
  const paid = Number(document.getElementById("paidCoin").value) || 0;

  const total = Math.floor(free * 0.3 + paid * 0.9);

  document.getElementById("coinValue").textContent = total;
}

function openMirrativ() {
  window.open("https://www.mirrativ.com/coin_purchase", "_blank");
}
</script>

</body>
</html>
